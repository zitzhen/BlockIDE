name: Build & Release

# 构建三平台安装包并创建 GitHub Release。
# - 手动触发（workflow_dispatch）时可指定 tag，默认按 package.json 版本生成 v<version>
# - 推送 v* tag 时自动触发
# - 两种方式默认都创建「草稿(draft)」发布，确认无误后在 GitHub 上点击 Publish release
# 实际构建逻辑在可复用工作流 build.yml / build-snap.yml 中。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，留空则使用 v<package.json 版本>'
        required: false
        type: string
      draft:
        description: '创建为草稿发布（默认开启）'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve version, tag and release flags
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            [ -z "$TAG" ] && TAG="v${VERSION}"
            DRAFT="${INPUT_DRAFT}"
            PRERELEASE="${INPUT_PRERELEASE}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRAFT="true"
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $VERSION, draft=$DRAFT, prerelease=$PRERELEASE)"

  # 三平台各自独立调用同一个可复用工作流，互不阻塞。
  # 拆成三个 job（而非一个 matrix）是为了让 snap 只等待 Linux，而不是等整组矩阵完成。
  # secrets: inherit 让签名密钥 SIGNATURE_KEYS 透传给可复用工作流。
  build-linux:
    name: Build linux-x64
    needs: meta
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ubuntu-24.04
      platform: linux
      arch: x64
      version: ${{ needs.meta.outputs.version }}

  build-windows:
    name: Build win32-x64
    needs: meta
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: windows-2025
      platform: win32
      arch: x64
      version: ${{ needs.meta.outputs.version }}

  build-macos:
    name: Build darwin-arm64
    needs: meta
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos-26
      platform: darwin
      arch: arm64
      version: ${{ needs.meta.outputs.version }}

  # Snap 只依赖 Linux 产物，与 Windows/macOS 构建并行进行
  snap:
    name: Snap linux-x64
    needs: [meta, build-linux]
    uses: ./.github/workflows/build-snap.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      arch: x64

  release:
    name: Create draft release
    needs: [meta, build-linux, build-windows, build-macos, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      # 默认创建草稿发布；draft / prerelease 由上游 meta job 决定
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          DRAFT: ${{ needs.meta.outputs.draft }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets with --clobber"
            gh release upload "$TAG" dist/* --clobber
          else
            args=(release create "$TAG" --title "BlockIDE ${VERSION}" --generate-notes --target "$GITHUB_SHA")
            [ "$DRAFT" = "true" ] && args+=(--draft)
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh "${args[@]}" dist/*
          fi
