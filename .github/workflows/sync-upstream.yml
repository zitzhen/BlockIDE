name: Sync Upstream Tag

# 手动触发：把 microsoft/vscode 的 release tag 合并进 BlockIDE 的 main，并从合并结果创建 PR。
#
# 约定：
# - 只跟进上游 tag，不合并 upstream/main（main 是每日开发流，且会混入依赖体系迁移）。
# - 冲突只在同步分支上解决一次；可自动解决的只有「BlockIDE 侧已删除、上游又修改」的文件。
# - 仍有冲突时，把带冲突标记的合并结果提交到同步分支，并以 draft PR 发出，由人在分支上解决。
# - 配置 SYNC_TOKEN（PAT）时用它推送并创建 PR，这样 PR 会正常触发 CI；
#   只用 github.token 时 GitHub 不会为新建 PR 触发 pull_request 工作流，需要手动 rerun。
# - SYNC_TOKEN 还必须带 workflow 权限（经典 PAT 的 `workflow` scope，或细粒度 PAT 的
#   Workflows: Read and write），否则 GitHub 会拒绝推送含 .github/workflows 变更的分支。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag，例如 1.146.0；留空则取最新稳定 tag'
        required: false
        type: string
      prefer_ours:
        description: '冲突时保留 BlockIDE 一侧的路径 glob，逗号分隔，例如 test/smoke/**,.github/**'
        required: false
        type: string
      dry_run:
        description: '只检查合并与冲突，不推送分支、不创建 PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}

    steps:
      - name: Check push credentials
        if: env.HAS_SYNC_TOKEN != 'true' && inputs.dry_run == false
        run: |
          echo "::error::未配置 SYNC_TOKEN。上游同步一定会改到 .github/workflows，而 github.token 无权推送这类变更。请配置带 workflow 权限的 PAT（经典 PAT: workflow scope；细粒度 PAT: Workflows Read and write，同时需要 Contents 和 Pull requests 的读写）后重试。"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream tag
        id: sync
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREFER_OURS: ${{ inputs.prefer_ours }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          args=(--base main --report "$REPORT")
          if [ -n "$INPUT_TAG" ]; then
            args+=(--tag "$INPUT_TAG")
          fi
          if [ -n "$INPUT_PREFER_OURS" ]; then
            args+=(--prefer-ours "$INPUT_PREFER_OURS")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/sync-upstream-tag.sh "${args[@]}"

      - name: Push sync branch
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'conflict'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          TAG: ${{ steps.sync.outputs.tag }}
        run: |
          remote_tip=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          if [ -n "$remote_tip" ]; then
            git fetch --quiet origin "$BRANCH" || true
            subject=$(git log -1 --format=%s "$remote_tip" 2>/dev/null || true)
            if [ "$subject" != "chore: sync upstream $TAG" ]; then
              echo "::error::远端分支 $BRANCH 上已有非自动提交（可能是人工解决冲突的结果），请先删除该分支后重新运行。"
              exit 1
            fi
            git push --force origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Open or update pull request
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TAG: ${{ steps.sync.outputs.tag }}
          STATUS: ${{ steps.sync.outputs.status }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          echo "gh 身份：$(gh api user --jq .login 2>/dev/null || echo unknown)"
          gh auth status 2>&1 | head -20 || true
          echo "仓库权限：$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' 2>/dev/null || echo unknown)"

          body="$REPORT"
          if [ ! -f "$body" ]; then
            body="$RUNNER_TEMP/sync-report-missing.md"
            printf '同步脚本未生成报告，请查看工作流日志。\n' > "$body"
          fi
          title="chore: sync upstream $TAG"
          draft=()
          if [ "$STATUS" = "conflict" ]; then
            draft=(--draft)
          fi

          create_pr() {
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body" "${draft[@]}"
          }

          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            if ! gh pr edit "$existing" --title "$title" --body-file "$body"; then
              echo "::warning::SYNC_TOKEN 无法更新 PR #$existing，改用 github.token 重试。"
              GH_TOKEN="$FALLBACK_TOKEN" gh pr edit "$existing" --title "$title" --body-file "$body"
            fi
            if [ "$STATUS" = "merged" ]; then
              gh pr ready "$existing" || GH_TOKEN="$FALLBACK_TOKEN" gh pr ready "$existing" || true
            fi
            echo "已更新 PR #$existing"
          elif ! create_pr; then
            echo "::warning::SYNC_TOKEN 无法创建 PR，改用 github.token（该 PR 不会自动触发 CI，需要手动 rerun）。"
            env GH_TOKEN="$FALLBACK_TOKEN" gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body" "${draft[@]}"
          fi
          if [ "$STATUS" = "conflict" ]; then
            echo "::warning::同步分支上还有未解决的冲突，已在 draft PR 中等待人工处理。"
          fi

      - name: Summary
        if: always()
        run: |
          report="${{ runner.temp }}/sync-report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '同步脚本未生成报告，请查看上一步日志。' >> "$GITHUB_STEP_SUMMARY"
          fi
