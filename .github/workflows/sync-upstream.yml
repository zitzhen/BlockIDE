name: Sync Upstream Tag

# 手动触发：把 microsoft/vscode 的 release tag 合并进 BlockIDE 的 main，并从合并结果创建 PR。
#
# 认证：使用 GitHub App（App ID 5768659，installation 182176251）的安装令牌完成检出、推送和建 PR。
# - 私钥来自 secrets.APP_GITHUB_PRIVATE
# - App 需要 Contents: Read and write、Pull requests: Read and write、Workflows: Read and write
# - 提交身份固定为该 App 的 bot 用户（356916778），不使用个人账号
# - App 令牌不是 GITHUB_TOKEN，因此新建的 PR 会正常触发 CI
#
# 约定：
# - 只跟进上游 tag，不合并 upstream/main（main 是每日开发流，且会混入依赖体系迁移）。
# - 冲突只在同步分支上解决一次；可自动解决的只有「BlockIDE 侧已删除、上游又修改」的文件。
# - 仍有冲突时，把带冲突标记的合并结果提交到同步分支，并以 draft PR 发出，由人在分支上解决。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag，例如 1.146.0；留空则取最新稳定 tag'
        required: false
        type: string
      prefer_ours:
        description: '冲突时保留 BlockIDE 一侧的路径 glob，逗号分隔，例如 test/smoke/**,.github/**'
        required: false
        type: string
      dry_run:
        description: '只检查合并与冲突，不推送分支、不创建 PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_ID: '5768659'
      INSTALLATION_ID: '182176251'
      BOT_USER_ID: '356916778'
      HAS_APP_KEY: ${{ secrets.APP_GITHUB_PRIVATE != '' }}

    steps:
      - name: Check app credentials
        if: env.HAS_APP_KEY != 'true'
        run: |
          echo "::error::未配置 APP_GITHUB_PRIVATE（GitHub App 私钥），无法生成安装令牌。"
          exit 1

      - name: Create GitHub App token
        id: app-token
        env:
          PRIVATE_KEY: ${{ secrets.APP_GITHUB_PRIVATE }}
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const appId = process.env.APP_ID;
          const installationId = process.env.INSTALLATION_ID;
          const privateKey = (process.env.PRIVATE_KEY || '').replace(/\\n/g, '\n');

          if (!privateKey) {
            console.error('APP_GITHUB_PRIVATE 为空');
            process.exit(1);
          }

          const b64url = (input) => Buffer.from(input).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = b64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: appId }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.createSign('RSA-SHA256').update(unsigned).sign(privateKey);
          const jwt = `${unsigned}.${b64url(signature)}`;

          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                ...(options.headers || {})
              }
            });
            if (!response.ok) {
              console.error(`${path} -> ${response.status} ${await response.text()}`);
              process.exit(1);
            }
            return response.json();
          };

          (async () => {
            const app = await api('/app', { headers: { authorization: `Bearer ${jwt}` } });
            const installation = await api(`/app/installations/${installationId}/access_tokens`, {
              method: 'POST',
              headers: { authorization: `Bearer ${jwt}` }
            });

            const login = `${app.slug}[bot]`;
            console.log(`::add-mask::${installation.token}`);
            console.log(`安装令牌权限：${JSON.stringify(installation.permissions)}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `token=${installation.token}\nlogin=${login}\nslug=${app.slug}\n`);
            console.log(`GitHub App: ${app.slug} (id ${app.id})，安装 ${installationId}，提交身份 ${login}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check app permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls?per_page=1" >/dev/null 2>&1; then
            echo "::error::GitHub App 缺少 Pull requests 权限。请在 App 设置中把 Pull requests 设为 Read and write，并在安装页确认更新后再重试。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.login }}
        run: |
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"

      - name: Merge upstream tag
        id: sync
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREFER_OURS: ${{ inputs.prefer_ours }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          args=(--base main --report "$REPORT")
          if [ -n "$INPUT_TAG" ]; then
            args+=(--tag "$INPUT_TAG")
          fi
          if [ -n "$INPUT_PREFER_OURS" ]; then
            args+=(--prefer-ours "$INPUT_PREFER_OURS")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/sync-upstream-tag.sh "${args[@]}"

      - name: Push sync branch
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'conflict'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          TAG: ${{ steps.sync.outputs.tag }}
        run: |
          remote_tip=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          if [ -n "$remote_tip" ]; then
            git fetch --quiet origin "$BRANCH" || true
            subject=$(git log -1 --format=%s "$remote_tip" 2>/dev/null || true)
            if [ "$subject" != "chore: sync upstream $TAG" ]; then
              echo "::error::远端分支 $BRANCH 上已有非自动提交（可能是人工解决冲突的结果），请先删除该分支后重新运行。"
              exit 1
            fi
            git push --force origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Open or update pull request
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TAG: ${{ steps.sync.outputs.tag }}
          STATUS: ${{ steps.sync.outputs.status }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          body="$REPORT"
          if [ ! -f "$body" ]; then
            body="$RUNNER_TEMP/sync-report-missing.md"
            printf '同步脚本未生成报告，请查看工作流日志。\n' > "$body"
          fi
          title="chore: sync upstream $TAG"
          draft=()
          if [ "$STATUS" = "conflict" ]; then
            draft=(--draft)
          fi

          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
            if [ "$STATUS" = "merged" ]; then
              gh pr ready "$existing" || true
            fi
            echo "已更新 PR #$existing"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body" "${draft[@]}"
          fi
          if [ "$STATUS" = "conflict" ]; then
            echo "::warning::同步分支上还有未解决的冲突，已在 draft PR 中等待人工处理。"
          fi

      - name: Summary
        if: always()
        run: |
          report="${{ runner.temp }}/sync-report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '同步脚本未生成报告，请查看上一步日志。' >> "$GITHUB_STEP_SUMMARY"
          fi
