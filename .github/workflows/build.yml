name: Build

# 可复用的单平台构建工作流，由 release.yml 按平台矩阵调用。
# 每个平台的安装包在此完成并上传为 release-<platform>-<arch> 工件。
# Windows 的 MSI / MSIX 由单独的 installers job 产出（release-<platform>-installers-<arch>），
# 复用 build job 上传的客户端 zip，因此只改安装包时不必重跑整条 Windows 构建。
#
# 签名：私钥放在秘密变量 SIGNATURE_KEYS。macOS 的证书来源按优先级：
#   1) secrets.CRT 或 vars.CRT —— 完整证书链（叶子 + 逐级签发 CA，最后是自签名根）
#   2) vars.SIGNATURE_CRT      —— 旧的单张证书变量
# Windows 仍使用 vars.SIGNATURE_CRT（只需叶子证书）。两者均为 PEM。构建时会临时合成
# PFX（Windows）和 P12（macOS），对 exe / msi / msix 以及 app / dmg 做本地签名；
# 未设置时跳过所有签名步骤。
# macOS 的证书建议用完整链：codesign 需要自己构建到自签名根的链，只给 CA 签发的叶子
# 证书会因缺链而报 errSecInternalComponent。若只给了叶子证书，macOS 步骤会用同一把
# 私钥临时生成一张自签名证书完成签名（每次构建都不同）。
# macOS 会按公钥自动识别叶子证书并重排证书顺序，叶子证书在前/在后都能用。
# 可选 SIGNATURE_KEYS_PASSWORD：私钥若带口令，用它解密。
on:
  workflow_call:
    inputs:
      os:
        description: '运行器，如 ubuntu-24.04 / windows-2025 / macos-26'
        required: true
        type: string
      platform:
        description: '平台标识：linux / win32 / darwin'
        required: true
        type: string
      arch:
        description: '架构标识：x64 / arm64'
        required: true
        type: string
      version:
        description: '产品版本（来自 package.json）'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      VSCODE_ARCH: ${{ inputs.arch }}
      VSCODE_QUALITY: stable
      GITHUB_TOKEN: ${{ github.token }}
      HAS_SIGNING_KEYS: ${{ secrets.SIGNATURE_KEYS != '' }}
      # GitHub Releases 偶发 504，Electron 二进制统一走 npmmirror 镜像。
      # 内容完整性不受影响：@electron/get 从镜像取 SHASUMS256.txt，
      # gulp-electron 还会再对照仓库内 build/checksums/electron.txt 校验。
      # 若某次升级 Electron 时镜像尚未同步，临时删除此变量即可回退到 GitHub。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install build dependencies (Linux)
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev fakeroot rpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # core-ci 负责编译源码并生成 out-vscode-min 等打包产物
      - name: Compile
        run: npm run gulp core-ci

      # ---------------------------------------------------------------- Linux
      # 非 -ci 任务会编译内置扩展（含 copilot）并打包；-ci 仅打包，不包含
      # compileCopilotExtensionBuildTask / compileNonNativeExtensionsBuildTask
      - name: Package Linux (tar.gz / deb / rpm)
        if: inputs.platform == 'linux'
        run: |
          set -euo pipefail
          mkdir -p artifacts

          npm run gulp vscode-linux-x64-min

          tar -czf "artifacts/BlockIDE-linux-x64-${VERSION}.tar.gz" \
            -C "$(dirname "$GITHUB_WORKSPACE")" VSCode-linux-x64

          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          DEB_PATH="$(find .build/linux/deb -name '*.deb' -print -quit)"
          cp "$DEB_PATH" "artifacts/BlockIDE-linux-x64-${VERSION}.deb"

          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm
          RPM_PATH="$(find .build/linux/rpm -name '*.rpm' -print -quit)"
          cp "$RPM_PATH" "artifacts/BlockIDE-linux-x64-${VERSION}.rpm"

      # 生成 snap 工程目录并打成独立工件，供 build-snap.yml 直接使用
      - name: Prepare snap source (Linux)
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp vscode-linux-${VSCODE_ARCH}-prepare-snap
          SNAP_DIR="$(find ".build/linux/snap/${VSCODE_ARCH}" -maxdepth 1 -mindepth 1 -type d -name 'blockide-*' -print -quit)"
          tar -czf snap-src.tar.gz -C "$(dirname "$SNAP_DIR")" "$(basename "$SNAP_DIR")"

      # -------------------------------------------------------------- Windows
      # patchWin32Dependencies 会用 signtool.exe 剥掉依赖库上失效的 Authenticode 签名，
      # 而 GitHub 的 Windows 镜像不保证 Windows SDK 的 bin 在 PATH 里；缺了会 spawn
      # ENOENT，让整条客户端构建失败。
      - name: Add Windows SDK to PATH
        if: inputs.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $sdkDirectory = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'signtool.exe') } |
            Select-Object -First 1
          if (-not $sdkDirectory) { throw "signtool.exe not found under $sdkRoot" }
          "PATH=$sdkDirectory;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows SDK tools: $sdkDirectory"

      # 先产出客户端，签名后被打进 exe / zip / msi / msix，保证安装后主程序也是已签名的
      - name: Build Windows client
        if: inputs.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # $ErrorActionPreference 只对 cmdlet 生效，原生进程的非零退出码不会中断脚本，
          # 因此每个 npm 调用都要显式检查 $LASTEXITCODE。
          npm run gulp vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { throw "gulp vscode-win32-x64-min failed with exit code $LASTEXITCODE" }
          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { throw "gulp vscode-win32-x64-inno-updater failed with exit code $LASTEXITCODE" }

      # 私钥来自 secrets.SIGNATURE_KEYS，证书来自 vars.SIGNATURE_CRT，合成 PFX 后
      # 用于给客户端和安装包签名；证书 Subject 同时作为 MSIX 的 Publisher。
      # 逻辑放在 .github/actions/prepare-windows-signing，供客户端 job 和安装包 job 共用。
      - name: Prepare signing certificate (Windows)
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        uses: ./.github/actions/prepare-windows-signing
        with:
          signing-key: ${{ secrets.SIGNATURE_KEYS }}
          signing-crt: ${{ vars.SIGNATURE_CRT }}
          signing-key-password: ${{ secrets.SIGNATURE_KEYS_PASSWORD }}

      - name: Sign Windows client
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }

          $clientDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE) 'VSCode-win32-x64'
          $targets = Get-ChildItem $clientDir -Filter *.exe -File
          if (-not $targets) { throw "No executable found in $clientDir" }

          foreach ($file in $targets) {
            & $signtool sign /fd sha256 /f $env:SIGNING_PFX_PATH /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

      - name: Package Windows (exe / zip)
        if: inputs.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          # $ErrorActionPreference 只对 cmdlet 生效；npm/gulp 这类原生进程失败时脚本会继续往下跑，
          # v1.0.2 的 MSIX 就是这样在失败后被静默跳过、只发布了 3 个安装包的。
          function Invoke-Gulp([string]$name) {
            npm run gulp $name
            if ($LASTEXITCODE -ne 0) { throw "gulp $name failed with exit code $LASTEXITCODE" }
          }

          Invoke-Gulp vscode-win32-x64-system-setup

          Copy-Item ".build\win32-x64\system-setup\VSCodeSetup.exe" "artifacts\BlockIDE-win32-x64-$env:VERSION.exe"

          # zip 既是免安装版，也是 installers job 构建 MSI/MSIX 的输入
          Push-Location (Split-Path $env:GITHUB_WORKSPACE)
          try {
            7z.exe a -tzip "$env:GITHUB_WORKSPACE\artifacts\BlockIDE-win32-x64-$env:VERSION.zip" "VSCode-win32-x64"
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          # 上传前确认两个产物都在，缺任何一个都说明有步骤被静默跳过
          $expected = foreach ($extension in 'exe', 'zip') {
            Join-Path 'artifacts' "BlockIDE-win32-x64-$env:VERSION.$extension"
          }
          $missing = @($expected | Where-Object { -not (Test-Path $_) -or (Get-Item $_).Length -eq 0 })
          if ($missing.Count -gt 0) {
            throw "Missing Windows artifacts: $($missing -join ', ')"
          }

      - name: Sign Windows setup
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }

          $targets = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe' }
          if (-not $targets) { throw 'No Windows setup executable found to sign' }

          foreach ($file in $targets) {
            & $signtool sign /fd sha256 /f $env:SIGNING_PFX_PATH /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

      # ----------------------------------------------------------------- macOS
      - name: Build macOS client
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          npm run gulp vscode-darwin-arm64-min

      # 临时钥匙串路径必须是 $AGENT_TEMPDIRECTORY/buildagent.keychain，build/darwin/sign.ts 依赖它
      - name: Prepare signing certificate (macOS)
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNATURE_KEYS }}
          # 优先用 CRT（完整证书链，secret 或 variable 均可），没设置时回退到旧的单证书变量
          SIGNING_CRT: ${{ secrets.CRT || vars.CRT || vars.SIGNATURE_CRT }}
          SIGNATURE_KEYS_PASSWORD: ${{ secrets.SIGNATURE_KEYS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_CRT:-}" ]; then
            echo 'No signing certificate found: set secrets.CRT (or vars.CRT / vars.SIGNATURE_CRT) to the PEM chain.'
            exit 1
          fi

          KEY="$RUNNER_TEMP/blockide-signing.key"
          CERT="$RUNNER_TEMP/blockide-signing.crt"
          P12="$RUNNER_TEMP/blockide-signing.p12"
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          # 统一去掉 CRLF，避免从 Windows 粘贴进来的换行影响 PEM 解析
          printf '%s\n' "$SIGNING_KEY" | tr -d '\r' > "$KEY"
          printf '%s\n' "$SIGNING_CRT" | tr -d '\r' > "$CERT"

          # 按证书块拆分 PEM：即使 secret 里混入了私钥，也只会取证书部分
          CERT_DIR="$RUNNER_TEMP/blockide-certs"
          rm -rf "$CERT_DIR"
          mkdir -p "$CERT_DIR"
          awk -v dir="$CERT_DIR" '
            /-----BEGIN CERTIFICATE-----/ { n++; file = dir "/cert-" n ".pem"; capture = 1 }
            capture { print >> file }
            /-----END CERTIFICATE-----/ { capture = 0 }
          ' "$CERT"
          CERT_COUNT="$(ls -1 "$CERT_DIR" | wc -l | tr -d ' ')"
          if [ "$CERT_COUNT" -lt 1 ]; then
            echo '::error::The signing certificate contains no BEGIN CERTIFICATE block.'
            exit 1
          fi

          # 用公钥匹配找出真正与 SIGNATURE_KEYS 配对的叶子证书，并把链首调整为它，
          # 这样证书在 CRT 里的先后顺序（叶子在前 / CA 在前）都不影响结果。
          if [ -n "${SIGNATURE_KEYS_PASSWORD:-}" ]; then
            KEY_PUB="$(/usr/bin/openssl pkey -in "$KEY" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -pubout)"
          else
            KEY_PUB="$(/usr/bin/openssl pkey -in "$KEY" -pubout)"
          fi
          LEAF=""
          for cert in "$CERT_DIR"/cert-*.pem; do
            if [ "$(/usr/bin/openssl x509 -in "$cert" -noout -pubkey)" = "$KEY_PUB" ]; then
              LEAF="$cert"
              break
            fi
          done
          if [ -z "$LEAF" ]; then
            echo '::error::None of the certificates matches SIGNATURE_KEYS (public key mismatch).'
            exit 1
          fi
          if [ "$LEAF" != "$CERT_DIR/cert-1.pem" ]; then
            echo '::notice::Leaf certificate was not first in the PEM; reordering the chain leaf-first.'
            CHAIN_DIR="$RUNNER_TEMP/blockide-chain"
            rm -rf "$CHAIN_DIR"
            mkdir -p "$CHAIN_DIR"
            cp "$LEAF" "$CHAIN_DIR/cert-1.pem"
            index=1
            for cert in "$CERT_DIR"/cert-*.pem; do
              if [ "$cert" != "$LEAF" ]; then
                index=$((index + 1))
                cp "$cert" "$CHAIN_DIR/cert-$index.pem"
              fi
            done
            CERT_DIR="$CHAIN_DIR"
            LEAF="$CERT_DIR/cert-1.pem"
          fi
          ROOT="$CERT_DIR/cert-$CERT_COUNT.pem"

          echo "Signing PEM contains $CERT_COUNT certificate(s); leaf certificate:"
          /usr/bin/openssl x509 -in "$LEAF" -noout -subject -issuer -dates
          # 过期证书无论怎么设置信任都无法用于签名，提前给出明确错误
          if ! /usr/bin/openssl x509 -in "$LEAF" -noout -checkend 0 >/dev/null 2>&1; then
            echo '::error::The signing certificate has expired; codesign cannot use it.'
            exit 1
          fi

          # 校验链完整性：相邻证书的 issuer/subject 必须对上，最后一张必须自签名
          chain_complete=1
          index=1
          while [ "$index" -lt "$CERT_COUNT" ]; do
            child_issuer="$(/usr/bin/openssl x509 -in "$CERT_DIR/cert-$index.pem" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
            parent_subject="$(/usr/bin/openssl x509 -in "$CERT_DIR/cert-$((index + 1)).pem" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
            if [ "$child_issuer" != "$parent_subject" ]; then
              chain_complete=0
              break
            fi
            index=$((index + 1))
          done
          root_issuer="$(/usr/bin/openssl x509 -in "$ROOT" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          root_subject="$(/usr/bin/openssl x509 -in "$ROOT" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          if [ "$root_issuer" != "$root_subject" ]; then
            chain_complete=0
          fi

          if [ "$chain_complete" -eq 1 ]; then
            SIGN_CERT="$LEAF"
            TRUST_CERT="$ROOT"
            echo "Using the provided certificate chain (root: $ROOT)"
          else
            # 证书是 CA 签发的叶子证书，但缺签发它的 CA，codesign 无法
            # 构建到自签名根的链。这里用同一把私钥就地补一张自签名证书，
            # 保留原证书的 subject（CN/O/OU），让 CI 无需人工改变量也能签名。
            # 代价：每次构建生成的证书不同（序列号/有效期不同）。如果想固定证书，
            # 把签发 CA 的证书补进 secrets.CRT 即可，工作流会自动改回用你的链。
            echo "::warning::The signing certificate does not end in a self-signed root (last issuer: $root_issuer)."
            echo '::warning::Generating a self-signed certificate from SIGNATURE_KEYS for this build.'
            echo '::warning::Add the issuing CA certificate to secrets.CRT to sign with your own stable certificate chain.'
            SIGN_CERT="$RUNNER_TEMP/blockide-signing-selfsigned.crt"
            TRUST_CERT="$SIGN_CERT"
            EXT_FILE="$RUNNER_TEMP/blockide-signing-selfsigned.ext"
            CSR_FILE="$RUNNER_TEMP/blockide-signing-selfsigned.csr"
            printf '%s\n' \
              '[codesign]' \
              'basicConstraints=critical,CA:TRUE' \
              'keyUsage=critical,digitalSignature,keyCertSign' \
              'extendedKeyUsage=critical,codeSigning' > "$EXT_FILE"
            if [ -n "${SIGNATURE_KEYS_PASSWORD:-}" ]; then
              /usr/bin/openssl x509 -x509toreq -in "$LEAF" -signkey "$KEY" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -out "$CSR_FILE"
              /usr/bin/openssl x509 -req -in "$CSR_FILE" -signkey "$KEY" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -sha256 -days 7300 -extfile "$EXT_FILE" -extensions codesign -out "$SIGN_CERT"
            else
              /usr/bin/openssl x509 -x509toreq -in "$LEAF" -signkey "$KEY" -out "$CSR_FILE"
              /usr/bin/openssl x509 -req -in "$CSR_FILE" -signkey "$KEY" -sha256 -days 7300 -extfile "$EXT_FILE" -extensions codesign -out "$SIGN_CERT"
            fi
            echo 'Generated self-signed signing certificate:'
            /usr/bin/openssl x509 -in "$SIGN_CERT" -noout -subject -issuer -dates
          fi

          # Apple 的时间戳服务不保证支持非 Apple 签发的身份（codesign/osx-sign
          # 文档均注明），私有证书的时间戳也没有实际意义：直接关闭，避免签名阶段
          # 因时间戳服务拒绝而失败。只有证书链以 Apple 根证书结尾时才启用。
          if [ "$chain_complete" -eq 1 ] && printf '%s' "$root_subject" | grep -qi 'O=Apple Inc\.'; then
            echo 'Using the Apple timestamp service (chain is anchored at an Apple root)'
          else
            echo 'Disabling codesign timestamping (non-Apple signing identity)'
            echo 'CODESIGN_TIMESTAMP=none' >> "$GITHUB_ENV"
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PASSWORD="$(openssl rand -hex 24)"

          # 用系统自带的 LibreSSL 导出，默认算法较旧，Security.framework 才能导入。
          # 这里不拼空数组参数，macOS 默认的 bash 3.2 在 set -u 下展开空数组会报错。
          # 只导出叶子证书；证书链中的其他证书稍后单独导入临时钥匙串。
          if [ -n "${SIGNATURE_KEYS_PASSWORD:-}" ]; then
            /usr/bin/openssl pkcs12 -export -inkey "$KEY" -in "$SIGN_CERT" -out "$P12" \
              -passout "pass:$P12_PASSWORD" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -name BlockIDE
          else
            /usr/bin/openssl pkcs12 -export -inkey "$KEY" -in "$SIGN_CERT" -out "$P12" \
              -passout "pass:$P12_PASSWORD" -name BlockIDE
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 中间/根 CA 必须进钥匙串，codesign 才能把完整的链嵌进签名。
          # 自动生成自签名证书时没有额外证书需要导入。
          if [ "$SIGN_CERT" = "$LEAF" ]; then
            for extra in "$CERT_DIR"/cert-*.pem; do
              if [ "$extra" != "$LEAF" ]; then
                security import "$extra" -k "$KEYCHAIN"
              fi
            done
          fi

          # 只把链上的自签名根（或自动生成的自签名证书）注册为信任锚，
          # 叶子证书保持“使用系统默认”。千万不要把叶子证书设成 trustAsRoot：
          # 那会让链在叶子处截断，codesign 报
          # "unable to build chain to self-signed root" + errSecInternalComponent。
          echo "Registering chain root as trustRoot for the codeSign policy: $TRUST_CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$TRUST_CERT"

          # 用证书的 SHA-1 指纹而不是展示名作为身份：find-identity 的展示名可能带
          # "(CSSMERR_TP_NOT_TRUSTED)" 之类的诊断后缀，按引号截取会把后缀一起写进
          # CODESIGN_IDENTITY，codesign 于是报 "no identity found"。
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-Fa-f]{40}' | head -1 || true)"
          if [ -z "$identity" ]; then
            # 身份尚未被判定为 valid 时 -v 可能什么都不列，退回完整身份列表
            identity="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-Fa-f]{40}' | head -1 || true)"
          fi
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            echo 'No code signing identity found in the temporary keychain'
            exit 1
          fi

          valid_line="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "$identity" || true)"
          if [ -z "$valid_line" ] || printf '%s\n' "$valid_line" | grep -q 'CSSMERR'; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            security verify-cert -c "$SIGN_CERT" -p codeSign || true
            echo "::error::Signing identity $identity is still not trusted after registering $TRUST_CERT as the trust root."
            exit 1
          fi
          echo "Signing identity: $identity"

          # 用主可执行文件的副本做一次真实签名预检：证书链不完整或钥匙串访问
          # 有问题时 codesign 会返回 errSecInternalComponent，这里提前失败，
          # 不必等到几分钟后签整个 app 才报错。
          PREFLIGHT="$RUNNER_TEMP/blockide-signing-preflight"
          PRODUCT_NAME="$(node -p "require('./product.json').nameLong")"
          APP_BINARY="$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${VSCODE_ARCH}/${PRODUCT_NAME}.app/Contents/MacOS/${PRODUCT_NAME}"
          if [ -f "$APP_BINARY" ]; then
            cp -p "$APP_BINARY" "$PREFLIGHT"
          else
            printf 'preflight\n' > "$PREFLIGHT"
          fi
          if ! codesign --force --sign "$identity" --keychain "$KEYCHAIN" --timestamp=none "$PREFLIGHT"; then
            echo '::error::codesign preflight failed; the signing identity or its certificate chain is unusable.'
            exit 1
          fi
          rm -f "$PREFLIGHT"

          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "AGENT_TEMPDIRECTORY=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Sign macOS app
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        run: |
          set -euo pipefail
          node build/darwin/sign.ts "$(dirname "$GITHUB_WORKSPACE")"

      - name: Package macOS (zip)
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd "$(dirname "$GITHUB_WORKSPACE")" \
            && zip -Xry "$GITHUB_WORKSPACE/artifacts/BlockIDE-darwin-arm64-${VERSION}.zip" VSCode-darwin-arm64)

      - name: Package macOS (dmg)
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node build/darwin/create-dmg.ts "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE/artifacts"
          mv "artifacts/VSCode-darwin-arm64.dmg" "artifacts/BlockIDE-darwin-arm64-${VERSION}.dmg"

      - name: Sign macOS dmg
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        run: |
          set -euo pipefail
          dmg="artifacts/BlockIDE-darwin-arm64-${VERSION}.dmg"
          codesign --force --timestamp=none --sign "$CODESIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.platform }}-${{ inputs.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload snap source
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-src-linux-${{ inputs.arch }}
          path: snap-src.tar.gz
          if-no-files-found: error
          retention-days: 7

  # MSI / MSIX 单独成 job：从 build job 上传的 zip 里还原已签名的客户端再打包。
  # 拆分不会缩短发版总时长（Windows 不是关键路径），但把「改安装包」的反馈回路
  # 从整条 Windows 构建缩短到只需要重跑本 job（GitHub 支持只重跑失败的 job）。
  installers:
    name: Package Windows installers (${{ inputs.arch }})
    if: inputs.platform == 'win32'
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      VSCODE_ARCH: ${{ inputs.arch }}
      HAS_SIGNING_KEYS: ${{ secrets.SIGNATURE_KEYS != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # build/npm/dirs.ts 里包含子模块 extensions/minecraft-workbench，
          # node_modules 缓存键要读它的 package-lock.json
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # 本 job 只需要运行 gulp 打包任务，不需要编译产物（out/），也不该重付一次
      # 约 11 分钟的 npm ci。先复用仓库已有的 node_modules 缓存（PR / main 的
      # pr-node-modules 会预热），命中时直接解包；未命中才安装并把结果存回缓存。
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ inputs.arch }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      - name: Download Windows client
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.platform }}-${{ inputs.arch }}
          path: staging

      # zip 就是 build job 里已签名的客户端（VSCode-win32-<arch>），
      # 解压回 buildPath() 期望的位置（仓库目录的同级目录）。
      - name: Restore Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem staging -Filter '*.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Client zip not found in the release artifacts' }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'client'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          7z.exe x $zip.FullName "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

          $source = Join-Path $extractRoot "VSCode-win32-$env:VSCODE_ARCH"
          if (-not (Test-Path (Join-Path $source 'BlockIDE.exe'))) {
            # 兜底：万一 zip 里没有顶层目录，就在解压结果里找含主程序的目录
            $candidate = Get-ChildItem $extractRoot -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'BlockIDE.exe') } |
              Select-Object -First 1
            if (-not $candidate) { throw "Client not found in $($zip.Name)" }
            $source = $candidate.FullName
          }

          Move-Item $source (Join-Path (Split-Path $env:GITHUB_WORKSPACE) "VSCode-win32-$env:VSCODE_ARCH")

      # MSIX 的 Publisher 必须取自签名证书，和客户端 job 共用同一份逻辑
      - name: Prepare signing certificate (Windows)
        if: env.HAS_SIGNING_KEYS == 'true'
        uses: ./.github/actions/prepare-windows-signing
        with:
          signing-key: ${{ secrets.SIGNATURE_KEYS }}
          signing-crt: ${{ vars.SIGNATURE_CRT }}
          signing-key-password: ${{ secrets.SIGNATURE_KEYS_PASSWORD }}

      - name: Package MSI / MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $arch = $env:VSCODE_ARCH
          $version = $env:VERSION

          # $ErrorActionPreference 只对 cmdlet 生效；npm/gulp 这类原生进程失败时脚本会继续往下跑，
          # v1.0.2 的 MSIX 就是这样在失败后被静默跳过、只发布了 3 个安装包的。
          function Invoke-Gulp([string]$name) {
            npm run gulp $name
            if ($LASTEXITCODE -ne 0) { throw "gulp $name failed with exit code $LASTEXITCODE" }
          }

          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed with exit code $LASTEXITCODE" }
          }

          $wixDirectory = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDirectory) {
            throw 'WiX Toolset v3 is required to build the MSI'
          }
          $env:WIX_BIN = Join-Path $wixDirectory.FullName 'bin'
          $env:PATH = "$env:WIX_BIN;$env:PATH"

          $sdkDirectory = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdkDirectory) {
            throw 'Windows SDK is required to build the MSIX'
          }
          $env:PATH = "$(Join-Path $sdkDirectory.FullName 'x64');$env:PATH"

          Invoke-Gulp "vscode-win32-$arch-msi"
          Invoke-Gulp "vscode-win32-$arch-msix"

          Copy-Item ".build\win32-$arch\msi\BlockIDE-*-$arch.msi" "artifacts\BlockIDE-win32-$arch-$version.msi"
          Copy-Item ".build\win32-$arch\msix\BlockIDE-*-$arch.msix" "artifacts\BlockIDE-win32-$arch-$version.msix"

          # 上传前确认两个安装包都在，缺任何一个都说明有步骤被静默跳过
          $expected = foreach ($extension in 'msi', 'msix') {
            "artifacts\BlockIDE-win32-$arch-$version.$extension"
          }
          $missing = @($expected | Where-Object { -not (Test-Path $_) -or (Get-Item $_).Length -eq 0 })
          if ($missing.Count -gt 0) {
            throw "Missing Windows installers: $($missing -join ', ')"
          }

      - name: Sign Windows installers
        if: env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }

          $targets = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.msi', '.msix' }
          if (-not $targets) { throw 'No Windows installers found to sign' }

          foreach ($file in $targets) {
            & $signtool sign /fd sha256 /f $env:SIGNING_PFX_PATH /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.platform }}-installers-${{ inputs.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
