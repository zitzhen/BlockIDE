name: Build

# 可复用的单平台构建工作流，由 release.yml 按平台矩阵调用。
# 每个平台的所有安装包在此完成并上传为 release-<platform>-<arch> 工件。
#
# 签名：私钥放在秘密变量 SIGNATURE_KEYS，证书放在可见变量 SIGNATURE_CRT（vars），
# 两者均为 PEM，Windows/macOS 共用同一张证书。调用方通过 secrets: inherit 传入私钥，
# vars 上下文在可复用工作流中天然可用。构建时会临时合成 PFX（Windows）和 P12（macOS），
# 对 exe / msi / msix 以及 app / dmg 做本地签名；未设置时跳过所有签名步骤。
# macOS 的 SIGNATURE_CRT 建议是完整证书链（叶子证书在前，逐级签发 CA 在后，最后一张
# 为自签名根）：codesign 需要自己构建到自签名根的链，只给 CA 签发的叶子证书会因缺链而
# 报 errSecInternalComponent。若只给了叶子证书，macOS 步骤会用同一把私钥临时生成一张
# 自签名证书完成签名（每次构建都不同），补上 CA 证书后会自动改回用你提供的链。
# 可选 SIGNATURE_KEYS_PASSWORD：私钥若带口令，用它解密。
on:
  workflow_call:
    inputs:
      os:
        description: '运行器，如 ubuntu-24.04 / windows-2025 / macos-26'
        required: true
        type: string
      platform:
        description: '平台标识：linux / win32 / darwin'
        required: true
        type: string
      arch:
        description: '架构标识：x64 / arm64'
        required: true
        type: string
      version:
        description: '产品版本（来自 package.json）'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      VSCODE_ARCH: ${{ inputs.arch }}
      VSCODE_QUALITY: stable
      GITHUB_TOKEN: ${{ github.token }}
      HAS_SIGNING_KEYS: ${{ secrets.SIGNATURE_KEYS != '' }}
      # GitHub Releases 偶发 504，Electron 二进制统一走 npmmirror 镜像。
      # 内容完整性不受影响：@electron/get 从镜像取 SHASUMS256.txt，
      # gulp-electron 还会再对照仓库内 build/checksums/electron.txt 校验。
      # 若某次升级 Electron 时镜像尚未同步，临时删除此变量即可回退到 GitHub。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install build dependencies (Linux)
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev fakeroot rpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # core-ci 负责编译源码并生成 out-vscode-min 等打包产物
      - name: Compile
        run: npm run gulp core-ci

      # ---------------------------------------------------------------- Linux
      # 非 -ci 任务会编译内置扩展（含 copilot）并打包；-ci 仅打包，不包含
      # compileCopilotExtensionBuildTask / compileNonNativeExtensionsBuildTask
      - name: Package Linux (tar.gz / deb / rpm)
        if: inputs.platform == 'linux'
        run: |
          set -euo pipefail
          mkdir -p artifacts

          npm run gulp vscode-linux-x64-min

          tar -czf "artifacts/BlockIDE-linux-x64-${VERSION}.tar.gz" \
            -C "$(dirname "$GITHUB_WORKSPACE")" VSCode-linux-x64

          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          DEB_PATH="$(find .build/linux/deb -name '*.deb' -print -quit)"
          cp "$DEB_PATH" "artifacts/BlockIDE-linux-x64-${VERSION}.deb"

          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm
          RPM_PATH="$(find .build/linux/rpm -name '*.rpm' -print -quit)"
          cp "$RPM_PATH" "artifacts/BlockIDE-linux-x64-${VERSION}.rpm"

      # 生成 snap 工程目录并打成独立工件，供 build-snap.yml 直接使用
      - name: Prepare snap source (Linux)
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp vscode-linux-${VSCODE_ARCH}-prepare-snap
          SNAP_DIR="$(find ".build/linux/snap/${VSCODE_ARCH}" -maxdepth 1 -mindepth 1 -type d -name 'blockide-*' -print -quit)"
          tar -czf snap-src.tar.gz -C "$(dirname "$SNAP_DIR")" "$(basename "$SNAP_DIR")"

      # -------------------------------------------------------------- Windows
      # 先产出客户端，签名后被打进 exe / zip / msi / msix，保证安装后主程序也是已签名的
      - name: Build Windows client
        if: inputs.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run gulp vscode-win32-x64-min
          npm run gulp vscode-win32-x64-inno-updater

      # 私钥来自 secrets.SIGNATURE_KEYS，证书来自 vars.SIGNATURE_CRT，分别落盘后再合成 PFX；
      # 证书 Subject 同时用作 MSIX 的 Publisher，否则 MSIX 签名会失败
      - name: Prepare signing certificate (Windows)
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNATURE_KEYS }}
          SIGNING_CRT: ${{ vars.SIGNATURE_CRT }}
          SIGNATURE_KEYS_PASSWORD: ${{ secrets.SIGNATURE_KEYS_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SIGNING_CRT) { throw 'SIGNATURE_CRT variable is not set; it must contain the PEM certificate' }

          $keyPath = Join-Path $env:RUNNER_TEMP 'blockide-signing.key'
          $certPath = Join-Path $env:RUNNER_TEMP 'blockide-signing.crt'
          [System.IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY)
          [System.IO.File]::WriteAllText($certPath, $env:SIGNING_CRT)
          if (-not (Select-String -Path $certPath -Pattern 'BEGIN CERTIFICATE' -Quiet)) {
            throw 'SIGNATURE_CRT does not contain a BEGIN CERTIFICATE block'
          }

          $openssl = (Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
          if (-not $openssl) {
            $gitOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
            if (Test-Path $gitOpenSsl) { $openssl = $gitOpenSsl }
          }
          if (-not $openssl) { throw 'openssl.exe not found, cannot build the PFX from SIGNATURE_KEYS/SIGNATURE_CRT' }

          $password = [System.Guid]::NewGuid().ToString('N')
          $pfxPath = Join-Path $env:RUNNER_TEMP 'blockide-signing.pfx'
          $keyArgs = @()
          if ($env:SIGNATURE_KEYS_PASSWORD) { $keyArgs = @('-passin', "pass:$env:SIGNATURE_KEYS_PASSWORD") }

          & $openssl pkcs12 -export -inkey $keyPath -in $certPath -out $pfxPath -passout "pass:$password" -name BlockIDE @keyArgs
          if ($LASTEXITCODE -ne 0) { throw "openssl pkcs12 exited with code $LASTEXITCODE" }

          $subject = ((& $openssl x509 -in $certPath -noout -subject -nameopt RFC2253) -join '') -replace '^subject\s*=\s*', ''
          if (-not $subject) { throw 'Failed to read certificate subject from SIGNATURE_CRT' }

          "SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BLOCKIDE_MSIX_PUBLISHER=$subject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing certificate subject: $subject"

      - name: Sign Windows client
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }

          $clientDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE) 'VSCode-win32-x64'
          $targets = Get-ChildItem $clientDir -Filter *.exe -File
          if (-not $targets) { throw "No executable found in $clientDir" }

          foreach ($file in $targets) {
            & $signtool sign /fd sha256 /f $env:SIGNING_PFX_PATH /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

      - name: Package Windows (exe / zip / msi / msix)
        if: inputs.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }

          $wixDirectory = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDirectory) {
            throw 'WiX Toolset v3 is required to build the MSI'
          }
          $env:WIX_BIN = Join-Path $wixDirectory.FullName 'bin'
          $env:PATH = "$env:WIX_BIN;$env:PATH"

          $sdkDirectory = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($sdkDirectory) {
            $env:PATH = "$(Join-Path $sdkDirectory.FullName 'x64');$env:PATH"
          }

          npm run gulp vscode-win32-x64-system-setup
          npm run gulp vscode-win32-x64-msi
          npm run gulp vscode-win32-x64-msix

          Copy-Item ".build\win32-x64\system-setup\VSCodeSetup.exe" "artifacts\BlockIDE-win32-x64-$env:VERSION.exe"
          Copy-Item ".build\win32-x64\msi\BlockIDE-*-x64.msi" "artifacts\BlockIDE-win32-x64-$env:VERSION.msi"
          Copy-Item ".build\win32-x64\msix\BlockIDE-*-x64.msix" "artifacts\BlockIDE-win32-x64-$env:VERSION.msix"

          Push-Location (Split-Path $env:GITHUB_WORKSPACE)
          try {
            7z.exe a -tzip "$env:GITHUB_WORKSPACE\artifacts\BlockIDE-win32-x64-$env:VERSION.zip" "VSCode-win32-x64"
          } finally {
            Pop-Location
          }

      - name: Sign Windows installers
        if: inputs.platform == 'win32' && env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          # bin 下同时存在 x86/x64 等目录，只按版本号目录排序，避免选中 x86 拼出错路径
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }

          $targets = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe', '.msi', '.msix' }
          if (-not $targets) { throw 'No installer artifacts found to sign' }

          foreach ($file in $targets) {
            & $signtool sign /fd sha256 /f $env:SIGNING_PFX_PATH /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

      # ----------------------------------------------------------------- macOS
      - name: Build macOS client
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          npm run gulp vscode-darwin-arm64-min

      # 临时钥匙串路径必须是 $AGENT_TEMPDIRECTORY/buildagent.keychain，build/darwin/sign.ts 依赖它
      - name: Prepare signing certificate (macOS)
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNATURE_KEYS }}
          SIGNING_CRT: ${{ vars.SIGNATURE_CRT }}
          SIGNATURE_KEYS_PASSWORD: ${{ secrets.SIGNATURE_KEYS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_CRT:-}" ]; then
            echo 'SIGNATURE_CRT variable is not set; it must contain the PEM certificate'
            exit 1
          fi

          KEY="$RUNNER_TEMP/blockide-signing.key"
          CERT="$RUNNER_TEMP/blockide-signing.crt"
          P12="$RUNNER_TEMP/blockide-signing.p12"
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          printf '%s\n' "$SIGNING_CRT" > "$CERT"
          if ! grep -q 'BEGIN CERTIFICATE' "$CERT"; then
            echo 'SIGNATURE_CRT does not contain a BEGIN CERTIFICATE block'
            exit 1
          fi

          # SIGNATURE_CRT 必须是完整证书链或自签名证书：
          #   - 完整链：叶子证书在前，逐级签发 CA 在后，最后一张是自签名根；
          #   - 自签名证书：只有一张，且 issuer == subject。
          # 只给叶子证书不够：codesign 必须自己构建出到自签名根的链，缺失签发 CA 时
          # 会报 "unable to build chain to self-signed root" + errSecInternalComponent；
          # 而把叶子证书设成 trustAsRoot 会让链在叶子处截断，codesign 同样拒绝签名。
          CERT_DIR="$RUNNER_TEMP/blockide-certs"
          rm -rf "$CERT_DIR"
          mkdir -p "$CERT_DIR"
          awk -v dir="$CERT_DIR" '/-----BEGIN CERTIFICATE-----/{n++} n > 0 { file = dir "/cert-" n ".pem"; print >> file }' "$CERT"
          CERT_COUNT="$(ls "$CERT_DIR"/cert-*.pem | wc -l | tr -d ' ')"
          LEAF="$CERT_DIR/cert-1.pem"
          ROOT="$CERT_DIR/cert-$CERT_COUNT.pem"

          echo "SIGNATURE_CRT contains $CERT_COUNT certificate(s); signing certificate:"
          /usr/bin/openssl x509 -in "$LEAF" -noout -subject -issuer -dates
          # 过期证书无论怎么设置信任都无法用于签名，提前给出明确错误
          if ! /usr/bin/openssl x509 -in "$LEAF" -noout -checkend 0 >/dev/null 2>&1; then
            echo '::error::The certificate in SIGNATURE_CRT has expired; codesign cannot use it.'
            exit 1
          fi

          # 校验链完整性：相邻证书的 issuer/subject 必须对上，最后一张必须自签名
          chain_complete=1
          index=1
          while [ "$index" -lt "$CERT_COUNT" ]; do
            child_issuer="$(/usr/bin/openssl x509 -in "$CERT_DIR/cert-$index.pem" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
            parent_subject="$(/usr/bin/openssl x509 -in "$CERT_DIR/cert-$((index + 1)).pem" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
            if [ "$child_issuer" != "$parent_subject" ]; then
              chain_complete=0
              break
            fi
            index=$((index + 1))
          done
          root_issuer="$(/usr/bin/openssl x509 -in "$ROOT" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          root_subject="$(/usr/bin/openssl x509 -in "$ROOT" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          if [ "$root_issuer" != "$root_subject" ]; then
            chain_complete=0
          fi

          if [ "$chain_complete" -eq 1 ]; then
            SIGN_CERT="$LEAF"
            TRUST_CERT="$ROOT"
            echo "Using the provided certificate chain (root: $ROOT)"
          else
            # SIGNATURE_CRT 是 CA 签发的叶子证书，但缺签发它的 CA，codesign 无法
            # 构建到自签名根的链。这里用同一把私钥就地补一张自签名证书，
            # 保留原证书的 subject（CN/O/OU），让 CI 无需人工改变量也能签名。
            # 代价：每次构建生成的证书不同（序列号/有效期不同）。如果想固定证书，
            # 把签发 CA 的证书补进 SIGNATURE_CRT 即可，工作流会自动改回用你的链。
            echo "::warning::SIGNATURE_CRT does not end in a self-signed root (last issuer: $root_issuer)."
            echo '::warning::Generating a self-signed certificate from SIGNATURE_KEYS for this build.'
            echo '::warning::Add the issuing CA certificate to SIGNATURE_CRT to sign with your own stable certificate chain.'
            SIGN_CERT="$RUNNER_TEMP/blockide-signing-selfsigned.crt"
            TRUST_CERT="$SIGN_CERT"
            EXT_FILE="$RUNNER_TEMP/blockide-signing-selfsigned.ext"
            CSR_FILE="$RUNNER_TEMP/blockide-signing-selfsigned.csr"
            printf '%s\n' \
              '[codesign]' \
              'basicConstraints=critical,CA:TRUE' \
              'keyUsage=critical,digitalSignature,keyCertSign' \
              'extendedKeyUsage=critical,codeSigning' > "$EXT_FILE"
            if [ -n "${SIGNATURE_KEYS_PASSWORD:-}" ]; then
              /usr/bin/openssl x509 -x509toreq -in "$LEAF" -signkey "$KEY" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -out "$CSR_FILE"
              /usr/bin/openssl x509 -req -in "$CSR_FILE" -signkey "$KEY" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -sha256 -days 7300 -extfile "$EXT_FILE" -extensions codesign -out "$SIGN_CERT"
            else
              /usr/bin/openssl x509 -x509toreq -in "$LEAF" -signkey "$KEY" -out "$CSR_FILE"
              /usr/bin/openssl x509 -req -in "$CSR_FILE" -signkey "$KEY" -sha256 -days 7300 -extfile "$EXT_FILE" -extensions codesign -out "$SIGN_CERT"
            fi
            echo 'Generated self-signed signing certificate:'
            /usr/bin/openssl x509 -in "$SIGN_CERT" -noout -subject -issuer -dates
          fi

          # Apple 的时间戳服务不保证支持非 Apple 签发的身份（codesign/osx-sign
          # 文档均注明），私有证书的时间戳也没有实际意义：直接关闭，避免签名阶段
          # 因时间戳服务拒绝而失败。只有证书链以 Apple 根证书结尾时才启用。
          if [ "$chain_complete" -eq 1 ] && printf '%s' "$root_subject" | grep -qi 'O=Apple Inc\.'; then
            echo 'Using the Apple timestamp service (chain is anchored at an Apple root)'
          else
            echo 'Disabling codesign timestamping (non-Apple signing identity)'
            echo 'CODESIGN_TIMESTAMP=none' >> "$GITHUB_ENV"
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PASSWORD="$(openssl rand -hex 24)"

          # 用系统自带的 LibreSSL 导出，默认算法较旧，Security.framework 才能导入。
          # 这里不拼空数组参数，macOS 默认的 bash 3.2 在 set -u 下展开空数组会报错。
          # 只导出叶子证书；证书链中的其他证书稍后单独导入临时钥匙串。
          if [ -n "${SIGNATURE_KEYS_PASSWORD:-}" ]; then
            /usr/bin/openssl pkcs12 -export -inkey "$KEY" -in "$SIGN_CERT" -out "$P12" \
              -passout "pass:$P12_PASSWORD" -passin "pass:$SIGNATURE_KEYS_PASSWORD" -name BlockIDE
          else
            /usr/bin/openssl pkcs12 -export -inkey "$KEY" -in "$SIGN_CERT" -out "$P12" \
              -passout "pass:$P12_PASSWORD" -name BlockIDE
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 中间/根 CA 必须进钥匙串，codesign 才能把完整的链嵌进签名。
          # 自动生成自签名证书时没有额外证书需要导入。
          if [ "$SIGN_CERT" = "$LEAF" ]; then
            for extra in "$CERT_DIR"/cert-*.pem; do
              if [ "$extra" != "$LEAF" ]; then
                security import "$extra" -k "$KEYCHAIN"
              fi
            done
          fi

          # 只把链上的自签名根（或自动生成的自签名证书）注册为信任锚，
          # 叶子证书保持“使用系统默认”。千万不要把叶子证书设成 trustAsRoot：
          # 那会让链在叶子处截断，codesign 报
          # "unable to build chain to self-signed root" + errSecInternalComponent。
          echo "Registering chain root as trustRoot for the codeSign policy: $TRUST_CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$TRUST_CERT"

          # 用证书的 SHA-1 指纹而不是展示名作为身份：find-identity 的展示名可能带
          # "(CSSMERR_TP_NOT_TRUSTED)" 之类的诊断后缀，按引号截取会把后缀一起写进
          # CODESIGN_IDENTITY，codesign 于是报 "no identity found"。
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-Fa-f]{40}' | head -1 || true)"
          if [ -z "$identity" ]; then
            # 身份尚未被判定为 valid 时 -v 可能什么都不列，退回完整身份列表
            identity="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-Fa-f]{40}' | head -1 || true)"
          fi
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            echo 'No code signing identity found in the temporary keychain'
            exit 1
          fi

          valid_line="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "$identity" || true)"
          if [ -z "$valid_line" ] || printf '%s\n' "$valid_line" | grep -q 'CSSMERR'; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            security verify-cert -c "$SIGN_CERT" -p codeSign || true
            echo "::error::Signing identity $identity is still not trusted after registering $TRUST_CERT as the trust root."
            exit 1
          fi
          echo "Signing identity: $identity"

          # 用主可执行文件的副本做一次真实签名预检：证书链不完整或钥匙串访问
          # 有问题时 codesign 会返回 errSecInternalComponent，这里提前失败，
          # 不必等到几分钟后签整个 app 才报错。
          PREFLIGHT="$RUNNER_TEMP/blockide-signing-preflight"
          PRODUCT_NAME="$(node -p "require('./product.json').nameLong")"
          APP_BINARY="$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${VSCODE_ARCH}/${PRODUCT_NAME}.app/Contents/MacOS/${PRODUCT_NAME}"
          if [ -f "$APP_BINARY" ]; then
            cp -p "$APP_BINARY" "$PREFLIGHT"
          else
            printf 'preflight\n' > "$PREFLIGHT"
          fi
          if ! codesign --force --sign "$identity" --keychain "$KEYCHAIN" --timestamp=none "$PREFLIGHT"; then
            echo '::error::codesign preflight failed; the signing identity or its certificate chain is unusable.'
            exit 1
          fi
          rm -f "$PREFLIGHT"

          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "AGENT_TEMPDIRECTORY=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Sign macOS app
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        run: |
          set -euo pipefail
          node build/darwin/sign.ts "$(dirname "$GITHUB_WORKSPACE")"

      - name: Package macOS (zip)
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd "$(dirname "$GITHUB_WORKSPACE")" \
            && zip -Xry "$GITHUB_WORKSPACE/artifacts/BlockIDE-darwin-arm64-${VERSION}.zip" VSCode-darwin-arm64)

      - name: Package macOS (dmg)
        if: inputs.platform == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node build/darwin/create-dmg.ts "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE/artifacts"
          mv "artifacts/VSCode-darwin-arm64.dmg" "artifacts/BlockIDE-darwin-arm64-${VERSION}.dmg"

      - name: Sign macOS dmg
        if: inputs.platform == 'darwin' && env.HAS_SIGNING_KEYS == 'true'
        run: |
          set -euo pipefail
          dmg="artifacts/BlockIDE-darwin-arm64-${VERSION}.dmg"
          codesign --force --timestamp=none --sign "$CODESIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.platform }}-${{ inputs.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload snap source
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-src-linux-${{ inputs.arch }}
          path: snap-src.tar.gz
          if-no-files-found: error
          retention-days: 7
