name: Build Snap

# 独立的 Snap 构建工作流，由 release.yml 调用。
# 输入是 build.yml 产出的 snap 工程目录（含已替换占位符的 snapcraft.yaml 与应用内容），
# 因此这里不需要 checkout 和 npm ci，只做 snapcraft 打包。
# 与主构建分离：snapcraft（apt 安装 + destructive 构建）不再拖慢 Linux 安装包产出，
# 且该 job 可单独重跑，不影响已上传的 tar.gz/deb/rpm 等产物。
on:
  workflow_call:
    inputs:
      version:
        description: '产品版本（来自 package.json）'
        required: true
        type: string
      arch:
        description: '架构标识：x64'
        required: false
        type: string
        default: x64

permissions:
  contents: read
  actions: read

jobs:
  snap:
    name: Snap linux-${{ inputs.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download snap source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap-src-linux-${{ inputs.arch }}
          path: snap-src

      - name: Extract snap source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf snap-src/snap-src.tar.gz -C .
          SNAP_DIR="$(find . -maxdepth 1 -mindepth 1 -type d -name 'blockide-*' -print -quit)"
          echo "SNAP_DIR=$SNAP_DIR" >> "$GITHUB_ENV"

      # 不用 snapcore/action-build：它通过 LXD 起容器，容器内 snapd 会因 apparmor
      # 不兼容而启动失败。--destructive-mode 直接在 runner 上构建，不依赖 LXD。
      # snapcraft 9 才支持 base core24（base 必须与 runner 的 glibc 匹配）。
      - name: Build snap
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic --channel=stable
          (cd "$SNAP_DIR" && sudo snapcraft pack --destructive-mode)
          SNAP_PATH="$(find "$SNAP_DIR" -maxdepth 1 -name '*.snap' -print -quit)"
          sudo chmod 0644 "$SNAP_PATH"
          mkdir -p snap-out
          cp "$SNAP_PATH" "snap-out/BlockIDE-linux-${{ inputs.arch }}-${VERSION}.snap"

      - name: Upload snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ inputs.arch }}-snap
          path: snap-out/*
          if-no-files-found: error
          retention-days: 7
